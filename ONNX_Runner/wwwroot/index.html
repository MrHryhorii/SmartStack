<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <!-- Basic meta tags and resource links for the Tsubaki TTS Engine web interface -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title and favicon -->
    <title>Tsubaki TTS Engine</title>
    <!-- Favicon for the application -->
    <link rel="icon" type="image/svg+xml" href="tsubaki.svg">
    <link rel="stylesheet" href="css/styles.css?v=samplerate1">
    <!-- Theme initialization script to handle light/dark mode toggling -->
    <script src="js/theme-init.js"></script>
</head>

<body>
    <!-- Decorative watermark element for visual branding -->
    <div class="watermark"></div>
    <!-- Main container for the application content -->
    <div class="container">
        <!-- Header section with title and theme toggle button -->
        <header class="header">
            <h1 class="title help-tooltip tooltip-wide"
                data-tooltip="Local TTS engine built around Piper, with optional OpenVoice voice cloning, streaming, audio effects, and cross-language pronunciation. Unsupported sounds are adapted to the sounds available in the active Piper model.">
                🎙️ Tsubaki TTS Engine</h1>
            <button id="themeToggle" class="btn-icon help-tooltip tooltip-right"
                data-tooltip="Switch the dashboard between light and dark themes. Only the interface changes; generated audio is unaffected."
                aria-label="Toggle light and dark theme">🌓</button>
        </header>
        <!-- Main layout containing the text input, controls, and log panel -->
        <main class="layout">
            <!-- Panel for text input and audio playback controls -->
            <section class="panel panel-main">
                <!-- Textarea for user input to synthesize speech from -->
                <div class="field">
                    <label for="textInput" class="label help-tooltip tooltip-wide"
                        data-tooltip="API: input. The only required API field; all other fields are optional. Enter text to synthesize. Use [[...]] for explicit raw phonemes. Single [...] or /.../ are treated as phonemes only when they contain IPA symbols. Unsupported sounds are adapted to the active Piper model.">Text (required)
                        <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                    <textarea id="textInput" spellcheck="false" placeholder="Enter text to synthesize..."></textarea>
                </div>
                <!-- Action buttons for generating speech and downloading the result -->
                <div class="actions">
                    <button id="generateBtn" class="btn-primary help-tooltip"
                        data-tooltip="Generate speech using the current settings. The dashboard sends them to Tsubaki's /tsbk/audio/speech endpoint.">Generate</button>
                    <button id="downloadBtn" class="btn-secondary help-tooltip tooltip-right"
                        data-tooltip="Download the most recently generated result." disabled>Download</button>
                </div>

                <!-- OPTIONS SECTION: Pronunciation Selection and Single Line Streaming -->
                <div class="generation-options">
                    <div class="toggle">
                        <input type="checkbox" id="streamToggle" checked>
                        <span class="toggle-label-help help-tooltip"
                            data-tooltip="API: stream (the dashboard always sends true/false). Start playback while audio is still being generated, if the format and browser support it. WAV waits for the complete audio; Base64 JSON must be received in full before normal playback.">
                            <label for="streamToggle">Real-time Playback</label>
                            <span class="help-mark" aria-hidden="true">ⓘ</span>
                        </span>
                    </div>

                    <div class="language-selector">
                        <label for="languageSelect" class="help-tooltip tooltip-right"
                            data-tooltip="API: language. Auto lets the server choose pronunciation using its language settings; if automatic detection is disabled, it uses the model language. Selecting a language applies its pronunciation rules to the text and bypasses detection. In both modes, unsupported sounds are adapted to the active Piper model, so an accent may remain.">Pronunciation:
                            <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                        <select id="languageSelect"></select>
                    </div>
                </div>

                <!-- Audio element for playing back the synthesized speech -->
                <audio id="audioPlayer" class="audio" controls aria-label="Generated audio"
                    title="Generated audio playback. During supported live streaming, these controls can pause or resume the current playback."></audio>
            </section>
            <!-- Side panel for selecting voice, format, and advanced DSP options -->
            <aside class="panel panel-side">
                <div class="field">
                    <label for="voiceSelect" class="label help-tooltip"
                        data-tooltip="API: voice (the dashboard always sends the selection). Choose the output voice. piper_base uses the active Piper model; other entries are local cloned voices processed through OpenVoice.">Voice
                        <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="output-options">
                    <div class="field">
                        <label for="formatSelect" class="label help-tooltip"
                            data-tooltip="API: response_format (the dashboard always sends it). MP3 is a general-purpose choice; Opus is compact and suited to streaming; AAC offers compact, lossy speech audio with streaming support. FLAC is lossless, WAV is uncompressed and waits for the full result, PCM is raw audio without a file header, and b64_json wraps MP3 in JSON.">Format
                            <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                        <select id="formatSelect">
                            <option value="mp3">MP3</option>
                            <option value="opus">Opus (Ogg)</option>
                            <option value="aac">AAC</option>
                            <option value="flac">FLAC</option>
                            <option value="wav">WAV</option>
                            <option value="pcm">Raw PCM</option>
                            <option value="b64_json">Base64 JSON (MP3)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="sampleRateNum" class="label help-tooltip tooltip-right"
                            data-tooltip="API: samplerate. Output sample rate in Hz. Empty inherits the server default; 0 keeps the normal model/codec rate. Nonzero requests are clamped to 8000–48000 Hz. Lower rates reduce high-frequency detail. MP3, AAC, and Opus select the nearest codec-supported input rate; Opus always decodes at 48000 Hz.">Rate (Hz)
                            <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                        <input type="number" id="sampleRateNum" aria-describedby="sampleRateError" min="0" max="48000" step="1" placeholder="0"
                            list="sampleRateOptions" aria-label="Output sample rate in Hz">
                        <p id="sampleRateError" class="field-error" role="alert" hidden></p>
                        <datalist id="sampleRateOptions">
                            <option value="0" label="Model/codec rate"></option>
                            <option value="8000"></option>
                            <option value="11025"></option>
                            <option value="12000"></option>
                            <option value="16000"></option>
                            <option value="22050"></option>
                            <option value="24000"></option>
                            <option value="32000"></option>
                            <option value="44100"></option>
                            <option value="48000"></option>
                        </datalist>
                    </div>
                </div>
                <!-- Slider and number input for adjusting the speed of the synthesized speech -->
                <div class="field">
                    <label class="label help-tooltip"
                        data-tooltip="API: speed (the dashboard always sends it). Speaking speed: 1.0 is normal, lower is slower, higher is faster. Extreme values can sound less natural.">Speed
                        <span class="help-mark" aria-hidden="true">ⓘ</span></label>
                    <div class="row">
                        <input type="range" id="speedSlider" aria-label="Speech speed" min="0.25" max="4" step="0.01"
                            value="1.0">
                        <input type="number" id="speedNum" aria-label="Speech speed value" class="input-num" min="0.25"
                            max="4" step="0.01" value="1.0">
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Collapsible section for voice shift controls, allowing users to adjust pitch and volume parameters -->
                <details class="advanced-group">
                    <summary title="Adjust pitch and output volume.">Voice Shift</summary>
                    <div class="group-content">
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="usePitch">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: pitch. Shift voice pitch without changing speaking speed. 1.0 applies no pitch shift; 0.5 is about one octave lower and 2.0 about one octave higher. Unchecked sends no override and uses the server default.">
                                    <label for="usePitch">Pitch</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="pitchSlider" aria-label="Pitch" min="0.5" max="2.0" step="0.01"
                                    value="1.0" disabled>
                                <input type="number" id="pitchNum" aria-label="Pitch value" class="input-num" min="0.5"
                                    max="2.0" step="0.01" value="1.0" disabled>
                            </div>
                        </div>

                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useVolume">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: volume. Output level multiplier: 0 mutes, 1.0 keeps the normal level, 0.5 requests about −6 dB, 2.0 about +6 dB, and 4.0 about +12 dB. The server's VolumeBoosterDb also applies; peak protection can reduce the actual boost. Unchecked sends no override and uses the server default.">
                                    <label for="useVolume">Volume Boost</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="volumeSlider" aria-label="Volume" min="0.0" max="4.0" step="0.1"
                                    value="1.0" disabled>
                                <input type="number" id="volumeNum" aria-label="Volume value" class="input-num"
                                    min="0.0" max="4.0" step="0.1" value="1.0" disabled>
                            </div>
                        </div>
                    </div>
                </details>
                <!-- Collapsible section for prosody and rhythm controls, allowing users to adjust expression and rhythm parameters -->
                <details class="advanced-group">
                    <summary title="Pronunciation, rhythm, and faster playback startup.">Speech Dynamics
                    </summary>
                    <div class="group-content">
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useNoiseScale">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: noise_scale. Controls Piper pronunciation and intonation variation. Higher values allow more variation; lower values are steadier. This does not directly control emotion. Unchecked sends no override and uses the model/server default.">
                                    <label for="useNoiseScale">Expression</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="nsSlider" aria-label="Expression variation" min="0" max="1.0"
                                    step="0.001" value="0.667" disabled>
                                <input type="number" id="nsNum" aria-label="Expression variation value"
                                    class="input-num" min="0" max="1.0" step="0.001" value="0.667" disabled>
                            </div>
                        </div>
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useNoiseW">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: noise_w. Controls variation in phoneme timing and rhythm. Higher values allow more timing variation; lower values are steadier. Unchecked sends no override and uses the model/server default.">
                                    <label for="useNoiseW">Rhythm</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="nwSlider" aria-label="Rhythm variation" min="0" max="1.0"
                                    step="0.001" value="0.8" disabled>
                                <input type="number" id="nwNum" aria-label="Rhythm variation value" class="input-num"
                                    min="0" max="1.0" step="0.001" value="0.8" disabled>
                            </div>
                        </div>
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="earlySplitToggle" checked>
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: early_split (the dashboard always sends true/false). Allows one early split at a suitable clause boundary to reduce time to the first audio. It can slightly change the opening phrase's rhythm or intonation. Recommended for streaming; usually unnecessary when waiting for the complete result.">
                                    <label for="earlySplitToggle">Early Split</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </details>
                <!-- Collapsible controls for character effects and acoustic spaces -->
                <details class="advanced-group">
                    <summary title="Voice effects and acoustic environments.">Audio Effects</summary>
                    <div class="group-content">
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useEffect">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: effect. Apply a character effect such as Telephone or LoFiTape. Unchecked sends no override, so the server default may still apply. Selecting None explicitly disables this character-effect layer.">
                                    <label for="useEffect">Character Effect</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <select id="effectSelect" disabled aria-label="Character effect"></select>

                            <div class="sub-control-label help-tooltip"
                                data-tooltip="API: effect_intensity. Strength of the selected character effect: 0 removes this effect's contribution, 1 applies its full strength.">
                                Intensity <span class="help-mark" aria-hidden="true">ⓘ</span>
                            </div>
                            <div class="row effect-row">
                                <input type="range" id="effectIntSlider" min="0" max="1" step="0.01" value="1" disabled
                                    aria-label="Character effect intensity">
                                <input type="number" id="effectIntNum" class="input-num" min="0" max="1" step="0.01"
                                    value="1" disabled aria-label="Character effect intensity value">
                            </div>
                        </div>
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useEnvironment">
                                <span class="toggle-label-help help-tooltip"
                                    data-tooltip="API: environment. Place the voice in a simulated room, hall, cave, or special environment such as Underwater. Unchecked sends no override, so the server default may still apply. Selecting None disables this spatial layer.">
                                    <label for="useEnvironment">Acoustic Space</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <select id="environmentSelect" disabled aria-label="Acoustic environment"></select>

                            <div class="sub-control-label help-tooltip"
                                data-tooltip="API: environment_intensity. Strength of the selected acoustic environment. Higher values make its reflections, echoes, or muffling more prominent; 0 removes it and 1 applies it fully. Try 0.25 as a general starting point.">
                                Intensity <span class="help-mark" aria-hidden="true">ⓘ</span>
                            </div>
                            <div class="row effect-row">
                                <input type="range" id="envIntSlider" min="0" max="1" step="0.01" value="0.25" disabled
                                    aria-label="Acoustic environment intensity">
                                <input type="number" id="envIntNum" class="input-num" min="0" max="1" step="0.01"
                                    value="0.25" disabled aria-label="Acoustic environment intensity value">
                            </div>

                            <div class="toggle" style="margin-top: 8px;">
                                <input type="checkbox" id="extendTailToggle" checked disabled>
                                <span class="toggle-label-help help-tooltip tooltip-up"
                                    data-tooltip="API: extend_reverb_tail. Let spatial echoes and reverberation fade naturally after speech ends. This can make the final audio longer. It affects acoustic environments only, not character effects; environments without a tail are unaffected.">
                                    <label for="extendTailToggle">Extend Reverb Tail</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </details>
                <!-- Ordered playback-device profiles, separate from character and spatial effects -->
                <details class="advanced-group" id="equalizerGroup">
                    <summary title="Choose a profile for the device that will play the audio.">Playback Device</summary>
                    <div class="group-content">
                        <p class="equalizer-hint" id="equalizerHint">
                            <span class="help-tooltip" tabindex="0" role="note" aria-label="Equalizer API help"
                                data-tooltip="API: equalizer. Accepts an array of profile IDs. Selected playback profiles apply sequentially from top to bottom. Leaving all unchecked sends an empty array and bypasses the server's playback-profile defaults.">
                                Usually select one profile.
                                <span class="help-mark" aria-hidden="true">ⓘ</span>
                            </span>
                        </p>
                        <ul class="equalizer-list" id="equalizerProfiles" aria-label="Playback profiles"
                            aria-describedby="equalizerHint"></ul>
                    </div>
                </details>
                <!-- Collapsible section for OpenVoice cloning parameters -->
                <details class="advanced-group">
                    <summary title="Fine-tuning for OpenVoice cloned voices.">Voice Cloning</summary>
                    <div class="group-content">
                        <div class="field">
                            <div class="toggle">
                                <input type="checkbox" id="useCloneInt">
                                <span class="toggle-label-help help-tooltip tooltip-up"
                                    data-tooltip="API: clone_intensity. Controls how strongly the cloned voice differs from the base Piper voice. 0 uses the base voice, 0.5 blends base and target voice characteristics, and 1 gives the normal target clone; values above 1 exaggerate the difference. Unchecked sends no override and uses the server default.">
                                    <label for="useCloneInt">Clone Intensity</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="cloneIntSlider" aria-label="Clone intensity" min="0" max="2.0"
                                    step="0.01" value="1.0" disabled>
                                <input type="number" id="cloneIntNum" aria-label="Clone intensity value"
                                    class="input-num" min="0" max="2.0" step="0.01" value="1.0" disabled>
                            </div>
                        </div>
                        <!-- Remove bottom margin to compensate for the hidden field below -->
                        <div class="field" style="margin-bottom: 0;">
                            <div class="toggle">
                                <input type="checkbox" id="useToneTemp">
                                <span class="toggle-label-help help-tooltip tooltip-up"
                                    data-tooltip="API: tone_temperature. OpenVoice conversion randomness for cloned voices. Lower values are steadier; higher values add variation and may cause trembling or warbling. This does not directly control emotion. Unchecked sends no override and uses the server default.">
                                    <label for="useToneTemp">Tone Temperature</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="toneTempSlider" aria-label="Tone temperature" min="0.1"
                                    max="2.0" step="0.01" value="0.7" disabled>
                                <input type="number" id="toneTempNum" aria-label="Tone temperature value"
                                    class="input-num" min="0.1" max="2.0" step="0.01" value="0.7" disabled>
                            </div>
                        </div>
                        <!-- Hidden: The acoustic difference is imperceptible to the human ear -->
                        <div class="field" style="display: none;">
                            <div class="toggle">
                                <input type="checkbox" id="useLpqf">
                                <span class="toggle-label-help help-tooltip tooltip-up"
                                    data-tooltip="API: low_pass_q_factor. Fine-tunes the cloned-voice low-pass filter only when that filter is enabled. The audible difference is usually very small. Unchecked sends no override and uses the server default.">
                                    <label for="useLpqf">Low-Pass Q-Factor</label>
                                    <span class="help-mark" aria-hidden="true">ⓘ</span>
                                </span>
                            </div>
                            <div class="row">
                                <input type="range" id="lpqfSlider" aria-label="Low-pass Q factor" min="0.1" max="1.0"
                                    step="0.001" value="0.707" disabled>
                                <input type="number" id="lpqfNum" aria-label="Low-pass Q factor value" class="input-num"
                                    min="0.1" max="1.0" step="0.001" value="0.707" disabled>
                            </div>
                        </div>
                    </div>
                </details>

            </aside>
            <!-- Panel for displaying status logs and messages from the application -->
            <section class="panel panel-log">
                <div id="statusLog" class="log"
                    title="Request, streaming, download, and error diagnostics from the dashboard."></div>
            </section>

        </main>
    </div>
    <!-- Main application script that handles UI interactions, API communication, and audio processing -->
    <script src="js/accordion.js"></script>
    <script type="module" src="js/app.js?v=samplerate1"></script>

</body>

</html>
